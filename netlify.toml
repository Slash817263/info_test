[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Build complete'"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/politica-de-confidentialitate"
  to = "/politica-de-confidentialitate.html"
  status = 200

[[redirects]]
  from = "/confidentialitate"
  to = "/politica-de-confidentialitate.html"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/SIGLA2.jpg"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://zarojtvcruwqywzkshbl.supabase.co https://cdn.jsdelivr.net"

[[edge_functions]]
  function = "protect-admin"
  path = "/admin"

[[edge_functions]]
  function = "protect-admin"
  path = "/admin.html"

[[edge_functions]]
  function = "protect-admin"
  path = "/assets/js/admin.js"


[[edge_functions]]
  function = "protect-admin"
  path = "/.netlify/functions/*"
